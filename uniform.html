<meta charset="UTF-8">
<title>連隊別軍服 ― 鷲とフルート</title>
<meta name="description" content="プロイセン軍の軍服を、部隊ごとの配色で素体に着せ替えて表示します。">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%85%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#1c2b39;
  --ink-soft:#2f4256;
  --prussian:#17395c;
  --prussian-bright:#3f6f9e;
  --parchment:#f4ecdb;
  --parchment-dim:#e8dcc2;
  --parchment-line:#d8c9a6;
  --gilt:#a9832f;
  --shadow:0 18px 40px -20px rgba(20,30,42,.35);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e9e1c9;
    --ink-soft:#cdbf9c;
    --prussian:#5f93c4;
    --prussian-bright:#8fb8de;
    --parchment:#12181f;
    --parchment-dim:#171f28;
    --parchment-line:#31404c;
    --gilt:#d8b25a;
    color-scheme:dark;
  }
}

*{box-sizing:border-box}
body{
  margin:0;
  padding-block:2.2rem 3rem;
  padding-left:20px; padding-right:20px;
  background:var(--parchment);
  color:var(--ink);
  font-family:"EB Garamond","Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:16px;
  line-height:1.7;
}
.wrap{max-width:1180px;margin:0 auto}

header.page{border-bottom:1px solid var(--parchment-line);padding-bottom:1.1rem;margin-bottom:1.2rem}
header.page .mark{
  font-family:"Cormorant Garamond",serif;font-style:italic;
  letter-spacing:.14em;text-transform:uppercase;font-size:.8rem;color:var(--gilt);margin:0 0 .25rem
}
header.page h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:1.85rem;margin:0;letter-spacing:.02em}
header.page p{margin:.5rem 0 0;color:var(--ink-soft);font-size:.95rem}

/* ---- 兵科タブ（歩兵・騎兵…／今後の追加を見越した構造） ---- */
#categoryTabs{
  display:flex;flex-wrap:wrap;gap:.5rem;
  margin:1.2rem 0 1.6rem;
}
#categoryTabs button{
  font:inherit;font-size:.92rem;
  padding:.5rem 1.1rem;
  border:1px solid var(--parchment-line);
  border-radius:999px;
  background:var(--parchment-dim);
  color:var(--ink-soft);
  cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
}
#categoryTabs button:hover{border-color:var(--prussian-bright);color:var(--prussian)}
#categoryTabs button[aria-pressed="true"]{
  background:var(--prussian);border-color:var(--prussian);color:var(--parchment);font-weight:600;
}
#categoryTabs button:disabled{
  opacity:.45;cursor:default;
}

.cols{display:grid;grid-template-columns:260px minmax(0,1fr);gap:2rem;align-items:start}
@media (max-width:820px){ .cols{grid-template-columns:1fr;gap:1.4rem} }

/* ---- 部隊ボタン ---- */
.panel{
  background:var(--parchment-dim);
  border:1px solid var(--parchment-line);
  border-radius:10px;
  padding:1rem;
}
.panel h2{
  font-family:"Cormorant Garamond",serif;font-size:1.05rem;font-weight:600;
  margin:0 0 .7rem;letter-spacing:.04em
}
#buttons{
  display:flex;flex-wrap:wrap;gap:.4rem;
  max-height:60vh;overflow-y:auto;
}
@media (max-width:820px){ #buttons{max-height:none} }
#buttons button{
  font:inherit;font-size:.9rem;line-height:1.2;
  padding:.42rem .7rem;
  border:1px solid var(--parchment-line);
  border-radius:6px;
  background:transparent;
  color:var(--ink-soft);
  cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
}
#buttons button:hover{border-color:var(--prussian-bright);color:var(--prussian)}
#buttons button[aria-pressed="true"]{
  background:var(--prussian);border-color:var(--prussian);color:var(--parchment);
  font-weight:600;
}

/* ---- 表示ステージ ---- */
/* width を明示して確定させる（max-widthだけだと、grid内での自動最小サイズ計算に
   コンテンツ量（読み込みログや情報パネルの文章の長さ）が影響し、部隊によって
   表示エリアの実寸が微妙に変わってしまうため） */
.figure{width:560px;max-width:100%;margin:0 auto}
.stage-name{
  font-family:"Cormorant Garamond",serif;font-size:1.1rem;letter-spacing:.05em;
  text-align:center;margin:0 0 .6rem;color:var(--ink-soft)
}
#stage{
  position:relative;
  width:100%;
  aspect-ratio:3 / 4;
  background:transparent;
  border:1px solid var(--parchment-line);
  border-radius:8px;
  overflow:hidden;
  box-shadow:var(--shadow);
}
#stage .layer{
  position:absolute;inset:0;
  width:100%;height:100%;
  display:block;
  object-fit:contain;
  pointer-events:none;
}

/* ---- 部隊情報（主な参戦など。今後 text_* 列を追加すれば自動的に並ぶ） ---- */
#infoPanels{margin-top:1.2rem}
.info-block{margin:0 0 1rem}
.info-block h3{
  font-family:"Cormorant Garamond",serif;font-size:.95rem;font-weight:600;
  letter-spacing:.04em;margin:0 0 .5rem;color:var(--ink-soft)
}
.info-block p{margin:0;font-size:.92rem}
.tag-list{list-style:none;display:flex;flex-wrap:wrap;gap:.4rem;margin:0;padding:0}
.tag-list li{
  font-size:.85rem;padding:.28rem .7rem;
  border:1px solid var(--parchment-line);border-radius:999px;
  background:var(--parchment-dim);color:var(--ink-soft);
}

/* ---- フリードリヒが語る一言 ---- */
#fritzPanel{
  display:flex;align-items:flex-end;gap:.9rem;
  margin-top:1.2rem;
}
#fritzPanel img{
  width:96px;height:auto;flex:none;
  filter:drop-shadow(0 6px 10px rgba(20,30,42,.25));
}
#fritzPanel .bubble{
  position:relative;
  background:var(--parchment-dim);
  border:1px solid var(--parchment-line);
  border-radius:12px;
  padding:.8rem 1rem;
  font-size:.92rem;
  color:var(--ink);
}
#fritzPanel .bubble::before{
  content:"";
  position:absolute;left:-9px;bottom:14px;
  width:0;height:0;
  border-top:8px solid transparent;
  border-bottom:8px solid transparent;
  border-right:9px solid var(--parchment-line);
}
#fritzPanel .bubble::after{
  content:"";
  position:absolute;left:-8px;bottom:14px;
  width:0;height:0;
  border-top:8px solid transparent;
  border-bottom:8px solid transparent;
  border-right:9px solid var(--parchment-dim);
}

/* ---- 読み込みログ ---- */
details.log{margin-top:1.4rem;font-size:.88rem}
details.log summary{cursor:pointer;color:var(--ink-soft);font-family:"Cormorant Garamond",serif;letter-spacing:.03em}
.log-list{list-style:none;margin:.6rem 0 0;padding:0;max-height:260px;overflow:auto}
.log-list li{display:flex;gap:.6rem;flex-wrap:wrap;padding:.18rem 0;border-bottom:1px dotted var(--parchment-line)}
.log-list code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;color:var(--prussian)}
.log-list span{color:var(--ink-soft)}
.log-ok{color:var(--ink-soft);margin:.6rem 0 0}
.log-err{color:#a33;margin:.6rem 0 0}
</style>

<div class="wrap">

  <header class="page">
    <p class="mark">Uniformen der Armee</p>
    <h1 id="pageTitle">プロイセン軍の連隊別軍服</h1>
    <p id="pageLede">フリードリヒ大王時代のプロイセン軍では、連隊ごとに襟やカフス、ボタン、レースなどの軍服の意匠が異なっていました。連隊を選択すると、軍服の配色、ボタン、レースなどの違いを着せ替えて比較できます。もう一度押すと素体に戻ります。</p>
  </header>

  <nav id="categoryTabs" aria-label="兵科を選ぶ"></nav>

  <div class="cols">

    <section class="panel">
      <h2 id="chooserLabel">部隊を選ぶ</h2>
      <div id="buttons"></div>
    </section>

    <section class="figure">
      <p class="stage-name" id="currentName">読み込み中…</p>
      <div id="stage"></div>

      <div id="infoPanels"></div>

      <div id="fritzPanel" hidden>
        <img src="img/frederickmini_stand_upscaled_wo_background.png" alt="フリードリヒ大王">
        <p class="bubble" id="fritzText"></p>
      </div>

      <details class="log">
        <summary id="logSummary">読み込みログ</summary>
        <div id="log"></div>
      </details>
    </section>

  </div>
</div>

<script src="js/uniform.js"></script>
